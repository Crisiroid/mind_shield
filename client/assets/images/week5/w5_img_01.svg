<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FAFAF7"/>
  <!-- W5-IMG-01: Activity reduction cycle -->
  <!-- Cycle boxes in a circular arrangement -->
  <rect x="130" y="25" width="140" height="45" rx="10" fill="#F5E6D3" stroke="#C4956A" stroke-width="1.8"/>
  <text x="200" y="52" text-anchor="middle" font-size="11" fill="#8B6914" font-family="sans-serif" font-weight="bold">خلق/انرژی پایین</text>
  <line x1="270" y1="48" x2="300" y2="80" stroke="#6BB5A0" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="230" y="85" width="150" height="45" rx="10" fill="#F5E6D3" stroke="#C4956A" stroke-width="1.8"/>
  <text x="305" y="112" text-anchor="middle" font-size="11" fill="#8B6914" font-family="sans-serif" font-weight="bold">کاهش فعالیت</text>
  <line x1="305" y1="130" x2="285" y2="165" stroke="#6BB5A0" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="150" y="170" width="170" height="45" rx="10" fill="#F5E6D3" stroke="#C4956A" stroke-width="1.8"/>
  <text x="235" y="197" text-anchor="middle" font-size="11" fill="#8B6914" font-family="sans-serif" font-weight="bold">کاهش لذت و پیشرفت</text>
  <line x1="150" y1="192" x2="115" y2="165" stroke="#6BB5A0" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="20" y="110" width="150" height="45" rx="10" fill="#F5E6D3" stroke="#C4956A" stroke-width="1.8"/>
  <text x="95" y="137" text-anchor="middle" font-size="11" fill="#8B6914" font-family="sans-serif" font-weight="bold">خلق پایین‌تر</text>
  <line x1="95" y1="110" x2="130" y2="75" stroke="#6BB5A0" stroke-width="2" marker-end="url(#a5)"/>
  <!-- Cycle arrow indicator -->
  <text x="200" y="135" text-anchor="middle" font-size="28" fill="#C4956A" opacity="0.4">↻</text>
  <!-- Exit arrow -->
  <rect x="90" y="260" width="220" height="50" rx="12" fill="#D4EDDA" stroke="#4A7A6A" stroke-width="2.5"/>
  <text x="200" y="282" text-anchor="middle" font-size="12" fill="#2D6A4A" font-family="sans-serif" font-weight="bold">خروج از چرخه:</text>
  <text x="200" y="300" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">یک فعالیت کوچک و برنامه‌ریزی‌شده</text>
  <line x1="200" y1="215" x2="200" y2="258" stroke="#4A7A6A" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#a5)"/>
  <defs><marker id="a5" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6BB5A0"/></marker></defs>
</svg>
