<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FAFAF7"/>
  <!-- W8-IMG-03: Pause vs Giving up - two columns -->
  <!-- Left: Temporary pause -->
  <rect x="25" y="30" width="165" height="280" rx="14" fill="#D4EDDA" stroke="#4A7A6A" stroke-width="2"/>
  <text x="107" y="58" text-anchor="middle" font-size="14" fill="#2D6A4A" font-family="sans-serif" font-weight="bold">وقفه موقت</text>
  <line x1="45" y1="70" x2="170" y2="70" stroke="#4A7A6A" stroke-width="1"/>
  <circle cx="55" cy="100" r="8" fill="#6BB5A0" opacity="0.6"/><text x="72" y="105" font-size="10" fill="#4A7A6A" font-family="sans-serif">چند روز تمرین</text><text x="72" y="118" font-size="10" fill="#4A7A6A" font-family="sans-serif">انجام نشده</text>
  <circle cx="55" cy="150" r="8" fill="#6BB5A0" opacity="0.6"/><text x="72" y="155" font-size="10" fill="#4A7A6A" font-family="sans-serif">شرایط زندگی یا</text><text x="72" y="168" font-size="10" fill="#4A7A6A" font-family="sans-serif">برنامه تغییر کرده</text>
  <circle cx="55" cy="200" r="8" fill="#6BB5A0" opacity="0.6"/><text x="72" y="205" font-size="10" fill="#4A7A6A" font-family="sans-serif">می‌توان با یک قدم</text><text x="72" y="218" font-size="10" fill="#4A7A6A" font-family="sans-serif">کوچک بازگشت</text>
  <text x="107" y="275" text-anchor="middle" font-size="28" fill="#4A7A6A" opacity="0.3">↻</text>
  <!-- Right: Complete abandonment -->
  <rect x="210" y="30" width="165" height="280" rx="14" fill="#F5E6D3" stroke="#C4956A" stroke-width="2"/>
  <text x="292" y="58" text-anchor="middle" font-size="13" fill="#8B6914" font-family="sans-serif" font-weight="bold">کنارگذاشتن کامل</text>
  <line x1="230" y1="70" x2="355" y2="70" stroke="#C4956A" stroke-width="1"/>
  <circle cx="240" cy="100" r="8" fill="#C4956A" opacity="0.5"/><text x="257" y="105" font-size="10" fill="#8B6914" font-family="sans-serif">«دیگر فایده‌ای</text><text x="257" y="118" font-size="10" fill="#8B6914" font-family="sans-serif">ندارد»</text>
  <circle cx="240" cy="150" r="8" fill="#C4956A" opacity="0.5"/><text x="257" y="155" font-size="10" fill="#8B6914" font-family="sans-serif">تمام مهارت‌ها را</text><text x="257" y="168" font-size="10" fill="#8B6914" font-family="sans-serif">کنار می‌گذارم</text>
  <circle cx="240" cy="200" r="8" fill="#C4956A" opacity="0.5"/><text x="257" y="205" font-size="10" fill="#8B6914" font-family="sans-serif">درخواست کمک را</text><text x="257" y="218" font-size="10" fill="#8B6914" font-family="sans-serif">به تعویق می‌اندازم</text>
  <text x="292" y="275" text-anchor="middle" font-size="28" fill="#C4956A" opacity="0.3">✗</text>
  <!-- Caption -->
  <text x="200" y="345" text-anchor="middle" font-size="10" fill="#7A9A7A" font-family="sans-serif">وقفه طبیعی است؛ مهم داشتن برنامه ساده برای بازگشت است</text>
</svg>
