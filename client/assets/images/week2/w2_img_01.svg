<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FAFAF7"/>
  
  <!-- Ground line -->
  <line x1="60" y1="350" x2="340" y2="350" stroke="#C8D8C8" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- Chair -->
  <rect x="155" y="240" width="100" height="12" rx="4" fill="#B8C9B8" stroke="#7A9A7A" stroke-width="1.5"/>
  <rect x="245" y="180" width="12" height="72" rx="4" fill="#B8C9B8" stroke="#7A9A7A" stroke-width="1.5"/>
  <line x1="165" y1="252" x2="165" y2="350" stroke="#7A9A7A" stroke-width="3" stroke-linecap="round"/>
  <line x1="247" y1="252" x2="247" y2="350" stroke="#7A9A7A" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Person - body (side view, sitting) -->
  <!-- Torso -->
  <path d="M200,160 C200,160 195,180 195,210 C195,235 198,245 200,248" fill="none" stroke="#4A7A6A" stroke-width="3" stroke-linecap="round"/>
  <path d="M200,160 C200,160 210,180 212,210 C214,235 210,245 208,248" fill="none" stroke="#4A7A6A" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="203" cy="135" r="28" fill="#F5E6D3" stroke="#4A7A6A" stroke-width="2.5"/>
  
  <!-- Neck -->
  <line x1="200" y1="160" x2="203" y2="155" stroke="#4A7A6A" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Shoulders -->
  <path d="M185,175 C190,170 210,170 220,175" fill="none" stroke="#4A7A6A" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Arms -->
  <path d="M185,175 C180,195 178,215 185,235" fill="none" stroke="#4A7A6A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M220,175 C225,195 227,215 220,235" fill="none" stroke="#4A7A6A" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Hands on lap -->
  <circle cx="185" cy="237" r="6" fill="#F5E6D3" stroke="#4A7A6A" stroke-width="2"/>
  <circle cx="220" cy="237" r="6" fill="#F5E6D3" stroke="#4A7A6A" stroke-width="2"/>
  
  <!-- Upper legs (sitting) -->
  <path d="M195,248 C185,250 170,252 160,255" fill="none" stroke="#4A7A6A" stroke-width="3" stroke-linecap="round"/>
  <path d="M208,248 C215,250 225,252 235,255" fill="none" stroke="#4A7A6A" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Lower legs -->
  <path d="M160,255 C158,280 155,310 150,345" fill="none" stroke="#4A7A6A" stroke-width="3" stroke-linecap="round"/>
  <path d="M235,255 C237,280 240,310 245,345" fill="none" stroke="#4A7A6A" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Feet -->
  <ellipse cx="145" cy="348" rx="14" ry="6" fill="#F5E6D3" stroke="#4A7A6A" stroke-width="2"/>
  <ellipse cx="250" cy="348" rx="14" ry="6" fill="#F5E6D3" stroke="#4A7A6A" stroke-width="2"/>
  
  <!-- Highlight circles - observation points -->
  <!-- Feet highlight -->
  <circle cx="145" cy="348" r="22" fill="none" stroke="#6BB5A0" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
  <circle cx="250" cy="348" r="22" fill="none" stroke="#6BB5A0" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
  
  <!-- Hands highlight -->
  <circle cx="185" cy="237" r="14" fill="none" stroke="#6BB5A0" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
  <circle cx="220" cy="237" r="14" fill="none" stroke="#6BB5A0" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
  
  <!-- Shoulders highlight -->
  <ellipse cx="203" cy="173" rx="30" ry="12" fill="none" stroke="#6BB5A0" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
  
  <!-- Breathing/chest highlight -->
  <ellipse cx="203" cy="205" rx="22" ry="18" fill="#6BB5A0" fill-opacity="0.08" stroke="#6BB5A0" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
  
  <!-- Small breathing arrows -->
  <path d="M230,200 L238,200" stroke="#6BB5A0" stroke-width="1.5" opacity="0.5"/>
  <path d="M230,210 L238,210" stroke="#6BB5A0" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Ground contact marks -->
  <line x1="130" y1="355" x2="160" y2="355" stroke="#6BB5A0" stroke-width="1.5" opacity="0.4"/>
  <line x1="235" y1="355" x2="265" y2="355" stroke="#6BB5A0" stroke-width="1.5" opacity="0.4"/>
</svg>
