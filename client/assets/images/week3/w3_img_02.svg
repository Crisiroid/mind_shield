<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#FAFAF7"/>
  <!-- W3-IMG-02: Thought is not reality — two side-by-side cards -->
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-size="14" fill="#4A7A6A" font-family="sans-serif" font-weight="bold">فکر، واقعیت نیست</text>
  <!-- Left card: Observable reality -->
  <rect x="15" y="50" width="175" height="160" rx="12" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="2"/>
  <circle cx="40" cy="75" r="14" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="40" y="80" text-anchor="middle" font-size="14">👁</text>
  <text x="102" y="78" text-anchor="middle" font-size="12" fill="#4A7A6A" font-family="sans-serif" font-weight="bold">واقعیت قابل مشاهده</text>
  <line x1="30" y1="92" x2="175" y2="92" stroke="#6BB5A0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="102" y="130" text-anchor="middle" font-size="13" fill="#3A6A5A" font-family="sans-serif">«پاسخی برای پیام</text>
  <text x="102" y="152" text-anchor="middle" font-size="13" fill="#3A6A5A" font-family="sans-serif">ارسال نشد.»</text>
  <!-- Right card: Thought or interpretation -->
  <rect x="210" y="50" width="175" height="160" rx="12" fill="#F0EDE6" stroke="#9A8A6A" stroke-width="2"/>
  <circle cx="235" cy="75" r="14" fill="#9A8A6A" fill-opacity="0.15" stroke="#9A8A6A" stroke-width="1.5"/>
  <text x="235" y="80" text-anchor="middle" font-size="14">💭</text>
  <text x="297" y="78" text-anchor="middle" font-size="12" fill="#7A6A4A" font-family="sans-serif" font-weight="bold">فکر یا تفسیر</text>
  <line x1="225" y1="92" x2="370" y2="92" stroke="#9A8A6A" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="297" y="130" text-anchor="middle" font-size="13" fill="#5A4A2A" font-family="sans-serif">«حتماً من را</text>
  <text x="297" y="152" text-anchor="middle" font-size="13" fill="#5A4A2A" font-family="sans-serif">نادیده گرفته‌اند.»</text>
  <!-- VS indicator -->
  <circle cx="200" cy="130" r="18" fill="#FAFAF7" stroke="#6BB5A0" stroke-width="2"/>
  <text x="200" y="135" text-anchor="middle" font-size="12" fill="#4A7A6A" font-family="sans-serif" font-weight="bold">vs</text>
  <!-- Caption -->
  <text x="200" y="245" text-anchor="middle" font-size="11" fill="#7A9A7A" font-family="sans-serif">یک اتفاق قابل مشاهده با تفسیر ذهن از آن متفاوت است</text>
  <!-- Check and question marks -->
  <circle cx="102" cy="185" r="12" fill="#6BB5A0" fill-opacity="0.2"/>
  <text x="102" y="190" text-anchor="middle" font-size="14" fill="#4A7A6A">✓</text>
  <circle cx="297" cy="185" r="12" fill="#9A8A6A" fill-opacity="0.2"/>
  <text x="297" y="190" text-anchor="middle" font-size="14" fill="#7A6A4A">?</text>
</svg>
