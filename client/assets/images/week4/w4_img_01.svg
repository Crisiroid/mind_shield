<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FAFAF7"/>
  <!-- W4-IMG-01: Examining Evidence - Initial thought → Evidence → Balanced thought -->
  <!-- Step 1: Initial Thought -->
  <rect x="110" y="35" width="180" height="60" rx="14" fill="#F5E6D3" stroke="#C4956A" stroke-width="2"/>
  <text x="200" y="58" text-anchor="middle" font-size="13" fill="#8B6914" font-family="sans-serif" font-weight="bold">فکر اولیه</text>
  <text x="200" y="78" text-anchor="middle" font-size="11" fill="#8B6914" font-family="sans-serif">(منفی یا افراطی)</text>
  <!-- Arrow down -->
  <line x1="200" y1="95" x2="200" y2="130" stroke="#6BB5A0" stroke-width="2.5" marker-end="url(#arr4)"/>
  <!-- Step 2: Evidence Examining -->
  <rect x="70" y="130" width="260" height="100" rx="14" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="2"/>
  <text x="200" y="158" text-anchor="middle" font-size="14" fill="#4A7A6A" font-family="sans-serif" font-weight="bold">بررسی شواهد</text>
  <!-- Two columns inside -->
  <line x1="200" y1="170" x2="200" y2="220" stroke="#4A7A6A" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="140" y="188" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">شواهد موافق</text>
  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">شواهد مخالف</text>
  <text x="140" y="208" text-anchor="middle" font-size="18" fill="#6BB5A0">✓</text>
  <text x="260" y="208" text-anchor="middle" font-size="18" fill="#6BB5A0">✓</text>
  <!-- Arrow down -->
  <line x1="200" y1="230" x2="200" y2="265" stroke="#6BB5A0" stroke-width="2.5" marker-end="url(#arr4)"/>
  <!-- Step 3: Balanced Thought -->
  <rect x="100" y="265" width="200" height="65" rx="14" fill="#D4EDDA" stroke="#4A7A6A" stroke-width="2.5"/>
  <text x="200" y="290" text-anchor="middle" font-size="14" fill="#2D6A4A" font-family="sans-serif" font-weight="bold">فکر متعادل‌تر</text>
  <text x="200" y="312" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">(واقع‌بینانه و منصفانه)</text>
  <!-- Caption -->
  <text x="200" y="365" text-anchor="middle" font-size="10.5" fill="#7A9A7A" font-family="sans-serif">از فکر اولیه مستقیماً به فکر مثبت نمی‌رویم</text>
  <text x="200" y="382" text-anchor="middle" font-size="10.5" fill="#7A9A7A" font-family="sans-serif">ابتدا اطلاعات را بررسی می‌کنیم</text>
  <defs><marker id="arr4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6BB5A0"/></marker></defs>
</svg>
