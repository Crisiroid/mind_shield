<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FAFAF7"/>
  <!-- W4-IMG-02: Characteristics of balanced thought - 3 cards -->
  <!-- Card 1: Doesn't deny -->
  <rect x="40" y="40" width="320" height="85" rx="14" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="2"/>
  <circle cx="80" cy="82" r="22" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="80" y="88" text-anchor="middle" font-size="20" fill="#4A7A6A">👁</text>
  <text x="120" y="70" font-size="14" fill="#2D6A4A" font-family="sans-serif" font-weight="bold">انکار نمی‌کند</text>
  <text x="120" y="95" font-size="11" fill="#4A7A6A" font-family="sans-serif">دشواری واقعی موقعیت را می‌پذیرد</text>
  <!-- Card 2: Doesn't exaggerate -->
  <rect x="40" y="145" width="320" height="85" rx="14" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="2"/>
  <circle cx="80" cy="187" r="22" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="80" y="193" text-anchor="middle" font-size="20" fill="#4A7A6A">⚖</text>
  <text x="120" y="175" font-size="14" fill="#2D6A4A" font-family="sans-serif" font-weight="bold">اغراق نمی‌کند</text>
  <text x="120" y="200" font-size="11" fill="#4A7A6A" font-family="sans-serif">از یک اتفاق، نتیجه کلی و قطعی نمی‌گیرد</text>
  <!-- Card 3: Is practical -->
  <rect x="40" y="250" width="320" height="85" rx="14" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="2"/>
  <circle cx="80" cy="292" r="22" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="80" y="298" text-anchor="middle" font-size="20" fill="#4A7A6A">🛠</text>
  <text x="120" y="280" font-size="14" fill="#2D6A4A" font-family="sans-serif" font-weight="bold">کاربردی است</text>
  <text x="120" y="305" font-size="11" fill="#4A7A6A" font-family="sans-serif">به فرد کمک می‌کند اقدام مناسب‌تری انتخاب کند</text>
</svg>
