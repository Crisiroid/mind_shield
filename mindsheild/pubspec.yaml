name: mindsheild
description: "MindShield - Psychology & Mental Health App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  persian_fonts: ^1.0.6

  # State Management
  provider: ^6.1.2

  # Network & HTTP
  dio: ^5.7.0
  internet_connection_checker_plus: ^2.5.1

  # Local Storage
  sqflite: ^2.4.1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.3

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  dartz: ^0.10.1
  rename_app: ^1.6.6
  package_info_plus: ^8.3.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Media players (weekly content library)
  video_player: ^2.9.2
  chewie: ^1.8.5
  just_audio: ^0.9.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/week1/
    - assets/images/week2/
    - assets/images/week3/
    - assets/images/week4/
    - assets/images/week5/
    - assets/images/week6/
    - assets/images/week7/
    - assets/images/week8/
    - assets/icons/
