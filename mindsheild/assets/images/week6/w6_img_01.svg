<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FAFAF7"/>
  <!-- W6-IMG-01: Thought as mental event - with cloud metaphor -->
  <!-- Sky background area -->
  <rect x="50" y="20" width="300" height="140" rx="20" fill="#E8F4EE" stroke="none"/>
  <!-- Cloud representing thought -->
  <ellipse cx="200" cy="70" rx="60" ry="30" fill="#ffffff" stroke="#6BB5A0" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="175" cy="75" rx="35" ry="22" fill="#ffffff" stroke="#6BB5A0" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="225" cy="75" rx="35" ry="22" fill="#ffffff" stroke="#6BB5A0" stroke-width="1.5" opacity="0.8"/>
  <text x="200" y="78" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">فکر</text>
  <!-- Person below observing -->
  <circle cx="200" cy="200" r="18" fill="#F5E6D3" stroke="#4A7A6A" stroke-width="2"/>
  <line x1="200" y1="218" x2="200" y2="260" stroke="#4A7A6A" stroke-width="2.5"/>
  <line x1="200" y1="235" x2="180" y2="250" stroke="#4A7A6A" stroke-width="2"/>
  <line x1="200" y1="235" x2="220" y2="250" stroke="#4A7A6A" stroke-width="2"/>
  <!-- Looking up arrow -->
  <path d="M200,190 L200,110" stroke="#6BB5A0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a6)"/>
  <!-- Steps below -->
  <rect x="50" y="285" width="300" height="35" rx="8" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.5"/>
  <text x="200" y="307" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">۱. فکر ظاهر می‌شود → ۲. متوجه می‌شوم</text>
  <rect x="50" y="330" width="300" height="35" rx="8" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.5"/>
  <text x="200" y="352" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">۳. لازم نیست باور کنم → ۴. بازگشت به لحظه حال</text>
  <!-- Caption -->
  <text x="200" y="388" text-anchor="middle" font-size="10" fill="#7A9A7A" font-family="sans-serif">فکر ظاهر می‌شود، می‌ماند و تغییر می‌کند</text>
  <defs><marker id="a6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6BB5A0"/></marker></defs>
</svg>
