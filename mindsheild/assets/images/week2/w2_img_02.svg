<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FAFAF7"/>
  
  <!-- Body outline - simple front view -->
  <!-- Head -->
  <circle cx="200" cy="65" r="25" fill="#F5E6D3" stroke="#4A7A6A" stroke-width="2.5"/>
  
  <!-- Neck -->
  <line x1="200" y1="90" x2="200" y2="105" stroke="#4A7A6A" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Torso -->
  <path d="M170,110 L165,200 L175,240 L200,250 L225,240 L235,200 L230,110 Z" fill="#F5E6D3" fill-opacity="0.3" stroke="#4A7A6A" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Shoulders -->
  <path d="M170,110 C155,112 140,118 135,125" fill="none" stroke="#4A7A6A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M230,110 C245,112 260,118 265,125" fill="none" stroke="#4A7A6A" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Arms -->
  <path d="M135,125 C130,155 128,185 130,215" fill="none" stroke="#4A7A6A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M265,125 C270,155 272,185 270,215" fill="none" stroke="#4A7A6A" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Hands -->
  <circle cx="130" cy="218" r="7" fill="#F5E6D3" stroke="#4A7A6A" stroke-width="2"/>
  <circle cx="270" cy="218" r="7" fill="#F5E6D3" stroke="#4A7A6A" stroke-width="2"/>
  
  <!-- Hips/Legs -->
  <path d="M175,240 L170,260 L165,320 L160,360" fill="none" stroke="#4A7A6A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M225,240 L230,260 L235,320 L240,360" fill="none" stroke="#4A7A6A" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Feet -->
  <ellipse cx="155" cy="365" rx="15" ry="7" fill="#F5E6D3" stroke="#4A7A6A" stroke-width="2"/>
  <ellipse cx="245" cy="365" rx="15" ry="7" fill="#F5E6D3" stroke="#4A7A6A" stroke-width="2"/>
  
  <!-- Body region highlights with arrows -->
  
  <!-- 1. Face area - top arrow -->
  <circle cx="200" cy="65" r="18" fill="#6BB5A0" fill-opacity="0.12" stroke="none"/>
  <path d="M310,65 L225,65" stroke="#6BB5A0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="310" cy="65" r="12" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="310" y="69" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">۶</text>
  
  <!-- 2. Shoulders & Hands -->
  <ellipse cx="200" cy="115" rx="40" ry="10" fill="#6BB5A0" fill-opacity="0.1" stroke="none"/>
  <path d="M310,120 L245,118" stroke="#6BB5A0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="310" cy="120" r="12" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="310" y="124" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">۵</text>
  
  <!-- 3. Chest -->
  <ellipse cx="200" cy="155" rx="28" ry="16" fill="#6BB5A0" fill-opacity="0.1" stroke="none"/>
  <path d="M310,165 L235,158" stroke="#6BB5A0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="310" cy="165" r="12" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="310" y="169" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">۴</text>
  
  <!-- 4. Belly -->
  <ellipse cx="200" cy="200" rx="25" ry="15" fill="#6BB5A0" fill-opacity="0.1" stroke="none"/>
  <path d="M310,210 L230,203" stroke="#6BB5A0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="310" cy="210" r="12" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="310" y="214" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">۳</text>
  
  <!-- 5. Feet -->
  <ellipse cx="200" cy="365" rx="50" ry="12" fill="#6BB5A0" fill-opacity="0.1" stroke="none"/>
  <path d="M310,350 L255,362" stroke="#6BB5A0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="310" cy="350" r="12" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="310" y="354" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">۱</text>
  
  <!-- 6. Whole body outline arrow -->
  <path d="M90,220 L155,220" stroke="#6BB5A0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <circle cx="80" cy="220" r="12" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="80" y="224" text-anchor="middle" font-size="11" fill="#4A7A6A" font-family="sans-serif">۲</text>
  
  <!-- Downward flow arrow on left side -->
  <path d="M105,100 L105,340" stroke="#6BB5A0" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6BB5A0"/>
    </marker>
  </defs>
</svg>
