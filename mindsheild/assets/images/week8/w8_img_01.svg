<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FAFAF7"/>
  <!-- W8-IMG-01: Skills map - 7 skill icons -->
  <!-- Row 1: 4 icons -->
  <rect x="20" y="20" width="85" height="85" rx="14" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.5"/>
