  <text x="246" y="80" text-anchor="middle" font-size="8" fill="#4A7A6A" font-family="sans-serif">افکار خودکار</text>
  <rect x="296" y="20" width="85" height="85" rx="14" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.5"/>
