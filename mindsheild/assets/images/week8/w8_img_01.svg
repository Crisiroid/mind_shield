  <text x="62" y="80" text-anchor="middle" font-size="8.5" fill="#4A7A6A" font-family="sans-serif">شناخت استرس</text>
  <rect x="112" y="20" width="85" height="85" rx="14" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.5"/>
  <text x="154" y="55" text-anchor="middle" font-size="24" fill="#4A7A6A">🫁</text>
  <text x="154" y="80" text-anchor="middle" font-size="8" fill="#4A7A6A" font-family="sans-serif">توجه به بدن</text>
  <rect x="204" y="20" width="85" height="85" rx="14" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.5"/>
