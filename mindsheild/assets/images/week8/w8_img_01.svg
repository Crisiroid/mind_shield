  <text x="338" y="80" text-anchor="middle" font-size="8" fill="#4A7A6A" font-family="sans-serif">فکر متعادل</text>
  <!-- Row 2: 3 icons -->
  <rect x="65" y="120" width="85" height="85" rx="14" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.5"/>
  <text x="107" y="155" text-anchor="middle" font-size="24" fill="#4A7A6A">🏃</text>
  <text x="107" y="180" text-anchor="middle" font-size="7.5" fill="#4A7A6A" font-family="sans-serif">فعال‌سازی رفتاری</text>
  <rect x="157" y="120" width="85" height="85" rx="14" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.5"/>
  <text x="199" y="155" text-anchor="middle" font-size="24" fill="#4A7A6A">👁</text>
  <text x="199" y="178" text-anchor="middle" font-size="8" fill="#4A7A6A" font-family="sans-serif">مشاهده و پذیرش</text>
  <rect x="249" y="120" width="85" height="85" rx="14" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.5"/>
  <text x="291" y="155" text-anchor="middle" font-size="24" fill="#4A7A6A">🔧</text>
  <text x="291" y="180" text-anchor="middle" font-size="8.5" fill="#4A7A6A" font-family="sans-serif">حل مسئله</text>
  <!-- Caption -->
  <text x="200" y="240" text-anchor="middle" font-size="10.5" fill="#7A9A7A" font-family="sans-serif">لازم نیست همه مهارت‌ها در همه موقعیت‌ها استفاده شوند</text>
