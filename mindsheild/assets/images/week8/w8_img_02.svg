<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FAFAF7"/>
  <!-- W8-IMG-02: Warning and action cycle -->
  <!-- Step 1: Warning -->
  <rect x="120" y="20" width="160" height="42" rx="10" fill="#F5E6D3" stroke="#C4956A" stroke-width="1.8"/>
  <text x="200" y="46" text-anchor="middle" font-size="12" fill="#8B6914" font-family="sans-serif" font-weight="bold">علامت هشدار</text>
  <text x="200" y="38" text-anchor="middle" font-size="14">⚠</text>
  <line x1="200" y1="62" x2="200" y2="78" stroke="#6BB5A0" stroke-width="2" marker-end="url(#a82)"/>
  <!-- Step 2: Pause -->
  <rect x="110" y="78" width="180" height="42" rx="10" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.8"/>
  <text x="200" y="104" text-anchor="middle" font-size="12" fill="#4A7A6A" font-family="sans-serif" font-weight="bold">مکث و بررسی وضعیت</text>
  <line x1="200" y1="120" x2="200" y2="136" stroke="#6BB5A0" stroke-width="2" marker-end="url(#a82)"/>
  <!-- Step 3: Choose skill -->
  <rect x="110" y="136" width="180" height="42" rx="10" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.8"/>
  <text x="200" y="162" text-anchor="middle" font-size="12" fill="#4A7A6A" font-family="sans-serif" font-weight="bold">انتخاب یک مهارت</text>
  <line x1="200" y1="178" x2="200" y2="194" stroke="#6BB5A0" stroke-width="2" marker-end="url(#a82)"/>
  <!-- Step 4: Small step -->
  <rect x="110" y="194" width="180" height="42" rx="10" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.8"/>
  <text x="200" y="220" text-anchor="middle" font-size="12" fill="#4A7A6A" font-family="sans-serif" font-weight="bold">انجام یک قدم کوچک</text>
  <line x1="200" y1="236" x2="200" y2="252" stroke="#6BB5A0" stroke-width="2" marker-end="url(#a82)"/>
  <!-- Step 5: Check result -->
  <rect x="110" y="252" width="180" height="42" rx="10" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="1.8"/>
  <text x="200" y="278" text-anchor="middle" font-size="12" fill="#4A7A6A" font-family="sans-serif" font-weight="bold">بررسی نتیجه</text>
  <line x1="200" y1="294" x2="200" y2="310" stroke="#6BB5A0" stroke-width="2" marker-end="url(#a82)"/>
  <!-- Step 6: Support if needed -->
  <rect x="100" y="310" width="200" height="48" rx="12" fill="#D4EDDA" stroke="#4A7A6A" stroke-width="2"/>
  <text x="200" y="339" text-anchor="middle" font-size="12" fill="#2D6A4A" font-family="sans-serif" font-weight="bold">استفاده از حمایت (در صورت نیاز)</text>
  <defs><marker id="a82" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6BB5A0"/></marker></defs>
</svg>
