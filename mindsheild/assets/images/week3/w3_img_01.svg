<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#FAFAF7"/>
  <!-- W3-IMG-01: Situation → Automatic Thought → Emotion & Body → Behavior -->
  <!-- Step 1: Situation -->
  <rect x="120" y="30" width="160" height="55" rx="12" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="2"/>
  <text x="200" y="62" text-anchor="middle" font-size="15" fill="#4A7A6A" font-family="sans-serif" font-weight="bold">موقعیت</text>
  <!-- Arrow 1 -->
  <line x1="200" y1="85" x2="200" y2="115" stroke="#6BB5A0" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- Step 2: Automatic Thought -->
  <rect x="100" y="115" width="200" height="55" rx="12" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="2"/>
  <text x="200" y="147" text-anchor="middle" font-size="15" fill="#4A7A6A" font-family="sans-serif" font-weight="bold">فکر خودکار</text>
  <!-- Arrow 2 -->
  <line x1="200" y1="170" x2="200" y2="200" stroke="#6BB5A0" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- Step 3: Emotion & Body -->
  <rect x="100" y="200" width="200" height="55" rx="12" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="2"/>
  <text x="200" y="232" text-anchor="middle" font-size="15" fill="#4A7A6A" font-family="sans-serif" font-weight="bold">هیجان و بدن</text>
  <!-- Arrow 3 -->
  <line x1="200" y1="255" x2="200" y2="285" stroke="#6BB5A0" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- Step 4: Behavior -->
  <rect x="120" y="285" width="160" height="55" rx="12" fill="#E8F4EE" stroke="#4A7A6A" stroke-width="2"/>
  <text x="200" y="317" text-anchor="middle" font-size="15" fill="#4A7A6A" font-family="sans-serif" font-weight="bold">رفتار</text>
  <!-- Small icons for each step -->
  <circle cx="80" cy="57" r="16" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="80" y="62" text-anchor="middle" font-size="16">🔔</text>
  <circle cx="80" cy="142" r="16" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="80" y="147" text-anchor="middle" font-size="16">💭</text>
  <circle cx="80" cy="227" r="16" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="80" y="232" text-anchor="middle" font-size="16">❤</text>
  <circle cx="80" cy="312" r="16" fill="#6BB5A0" fill-opacity="0.15" stroke="#6BB5A0" stroke-width="1.5"/>
  <text x="80" y="317" text-anchor="middle" font-size="16">⚡</text>
  <!-- Caption -->
  <text x="200" y="375" text-anchor="middle" font-size="11" fill="#7A9A7A" font-family="sans-serif">فکر خودکار سریع و بدون تصمیم آگاهانه ظاهر می‌شود</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6BB5A0"/></marker></defs>
</svg>
